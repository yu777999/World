name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Setup project
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          echo '{"appId":"com.worldmonitor.app","appName":"World Monitor","webDir":"www","server":{"androidScheme":"https"},"android":{"allowMixedContent":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
          chmod +x ./android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: world-monitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
